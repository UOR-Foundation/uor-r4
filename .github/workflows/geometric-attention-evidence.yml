name: geometric-attention-evidence

# Temporary evidence branch only; parent is the exact product PR head.
on:
  push:
    branches: ['codex/ci/geometric-attention-layout-4a0b0224-20261002']
permissions:
  contents: read
concurrency:
  group: geometric-attention-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/codex-geometric-attention
  CARGO_BUILD_JOBS: 2
  RAYON_NUM_THREADS: 2
  VECLIB_MAXIMUM_THREADS: 2
jobs:
  focused:
    name: ${{ matrix.task }}
    runs-on: macos-14
    timeout-minutes: ${{ matrix.limit }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - task: integer-session-tests
            limit: 30
          - task: replay-driver-build
            limit: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind exact source head
        shell: bash
        run: |
          mkdir evidence
          tested=$(git rev-parse HEAD^)
          test "$tested" = 4a0b0224a21826e0f99e753e3bfb133bce9d8264
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/geometric-attention-evidence.yml
          echo "UOR_BUILD_SOURCE_COMMIT=$tested" >> "$GITHUB_ENV"
          git log -2 --format='%H %s' > evidence/source-identity.txt
          git ls-files 'crates/uor-r4-integer/src/*.rs' 'crates/uor-r4-integer/tests/geometric_attention_allocations.rs' 'crates/uor-r4-training/src/*.rs' 'crates/uor-r4-training/examples/attention-geometric-session.rs' | xargs shasum -a 256 > evidence/source-sha256.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Platform and compiler
        shell: bash
        run: |
          rustc -Vv > evidence/compiler.txt
          cargo -V >> evidence/compiler.txt
          uname -a > evidence/platform.txt
          sysctl -n hw.ncpu >> evidence/platform.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: geometric-attention-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            merge-evidence-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            merge-evidence-v2-${{ runner.os }}-
      - name: Focused release integer tests
        id: integer
        if: matrix.task == 'integer-session-tests'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p uor-r4-integer --lib attention_session_ -- --nocapture 2>&1 | tee evidence/integer-tests.log
          grep -F 'test result: ok. 3 passed; 0 failed;' evidence/integer-tests.log
          cargo test --locked --release -p uor-r4-integer --lib geometric_context::tests -- --nocapture 2>&1 | tee evidence/context-tests.log
          cargo test --locked --release -p uor-r4-integer --test geometric_attention_allocations persistent_attention_successful_push_and_reset_have_zero_allocations -- --nocapture 2>&1 | tee evidence/allocation-tests.log
          grep -F 'test result: ok. 1 passed; 0 failed;' evidence/allocation-tests.log
      - name: Release replay driver build
        id: driver
        if: matrix.task == 'replay-driver-build'
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release -p uor-r4-training --example attention-geometric-session 2>&1 | tee evidence/driver-build.log
          cp "$CARGO_TARGET_DIR"/release/examples/attention-geometric-session evidence/
          shasum -a 256 evidence/attention-geometric-session > evidence/binary-sha256.txt
      - name: Retain outcome
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf '%s\n' 'task=${{ matrix.task }}' 'integer=${{ steps.integer.outcome }}' 'driver=${{ steps.driver.outcome }}' > evidence/outcome.txt
          cat evidence/outcome.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometric-attention-${{ matrix.task }}-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
