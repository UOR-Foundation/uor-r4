name: docs-site

# Changed documentation is built and checked on main. Only explicit manual
# publication from main writes the live book alongside the existing Studio.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHARTER.md'
      - 'README.md'
      - 'projects/**'
      - 'book.toml'
      - 'xtask/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build only, or publish the checked book on gh-pages'
        type: choice
        options:
          - build-only
          - gh-pages
        default: build-only

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  site:
    name: build and check the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-docs-site-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-docs-site-${{ runner.os }}-

      - name: Cache mdBook tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-0.5.4-mermaid-0.17.1-${{ runner.os }}

      - name: Install mdBook and mdbook-mermaid
        run: |
          set -euo pipefail
          command -v mdbook >/dev/null || cargo install --locked mdbook --version 0.5.4
          command -v mdbook-mermaid >/dev/null || cargo install --locked mdbook-mermaid --version 0.17.1

      - name: Stage the book source
        run: |
          set -euo pipefail
          cargo run -q --locked -p xtask -- book-stage
          # The mermaid assets are generated, not committed (no vendored blobs, charter §3.13).
          mdbook-mermaid install .

      - name: Build the book
        run: |
          set -euo pipefail
          mdbook build 2>&1 | tee build.log
          if grep -q ERROR build.log; then
            echo "::error::mdbook reported ERROR"
            exit 1
          fi

      - name: Check the built links
        run: cargo run -q --locked -p xtask -- book-check

      - name: Check the book artifact boundary
        run: |
          set -euo pipefail
          test -f book/index.html
          test ! -L book
          unexpected=$(find book ! -type f ! -type d -print -quit)
          if [ -n "$unexpected" ]; then
            echo "::error::the book contains a link or special file"
            exit 1
          fi

      - name: Pass the checked book to the manual publisher
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'gh-pages'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-book
          path: book/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish the checked book to gh-pages
    needs: site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'gh-pages'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/gh-pages
          path: site

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-book
          path: book

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test -f book/index.html
          test -d site/studio
          # Refuse archive contents that could overwrite the checkout or the Studio.
          for reserved in .git studio; do
            if [ -e "book/$reserved" ] || [ -L "book/$reserved" ]; then
              echo "::error::reserved path in book: $reserved"
              exit 1
            fi
          done
          # The book replaces everything except .git and studio/.
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name studio -exec rm -rf {} +
          cp -R book/. site/
          # Returning visitors still have the old Studio worker at this scope.
          cat > site/coi-serviceworker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.registration.unregister().then(() => self.clients.matchAll()).then((cs) => cs.forEach((c) => c.navigate(c.url)))));
          JS
          touch site/.nojekyll
          git -C site add -A
          git -C site diff --cached --exit-code HEAD -- studio
          if git -C site diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git -C site commit -q -m "docs site from ${GITHUB_SHA}"
          git -C site push origin HEAD:refs/heads/gh-pages
