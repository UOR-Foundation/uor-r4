name: native-held-credit-evidence
on:
  push:
    branches: ['codex/ci/native-held-48d71572-20261002']
permissions:
  contents: read
concurrency:
  group: native-held-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/codex-geometric-event-age-q4
  CARGO_BUILD_JOBS: 2
  RAYON_NUM_THREADS: 2
  VECLIB_MAXIMUM_THREADS: 2
jobs:
  focused:
    name: retained-native-credit-and-age
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind product source
        shell: bash
        run: |
          mkdir evidence
          tested=$(git rev-parse HEAD^)
          test "$tested" = 48d715728dfdc622b54b9313fbf3cc980031cc00
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/native-held-credit-evidence.yml
          echo "UOR_BUILD_SOURCE_COMMIT=$tested" >> "$GITHUB_ENV"
          git log -2 --format='%H %s' > evidence/source-identity.txt
          git ls-files 'crates/uor-r4-integer/src/*.rs' 'crates/uor-r4-training/src/*.rs' 'crates/uor-r4-training/examples/attention-geometric-event-age-check.rs' | xargs shasum -a 256 > evidence/source-sha256.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Compiler identity
        run: |
          rustc -Vv > evidence/compiler.txt
          cargo -V >> evidence/compiler.txt
          uname -a > evidence/platform.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/codex-geometric-event-age-q4
          key: event-age-${{ runner.os }}-connected-training-and-driver-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            event-age-${{ runner.os }}-connected-training-and-driver-${{ hashFiles('Cargo.lock') }}-
      - name: Held-input and learned-age contracts
        id: tests
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -l cargo test --locked --release -p uor-r4-training --lib held_credit_ -- --nocapture 2>&1 | tee evidence/held-tests.log
          grep -F 'test result: ok. 2 passed; 0 failed;' evidence/held-tests.log
          /usr/bin/time -l cargo test --locked --release -p uor-r4-training --lib native_read_learned_age_ -- --nocapture 2>&1 | tee evidence/age-source-tests.log
          grep -F 'test result: ok. 2 passed; 0 failed;' evidence/age-source-tests.log
          /usr/bin/time -l cargo test --locked --release -p uor-r4-training --lib geometric_event_age_native_credit_preserves_hard_reader_and_frozen_routes -- --nocapture 2>&1 | tee evidence/actual-reader-test.log
          grep -F 'test result: ok. 1 passed; 0 failed;' evidence/actual-reader-test.log
          cargo test --locked --release -p uor-r4-training --lib native_read_age_residual_ -- --nocapture 2>&1 | tee evidence/legacy-residual-tests.log
          grep -F 'test result: ok. 3 passed; 0 failed;' evidence/legacy-residual-tests.log
          cargo test --locked --release -p uor-r4-training --lib geometric_event_q4_age_residual_answer_credit_and_common_denominator -- --nocapture 2>&1 | tee evidence/legacy-answer-test.log
          grep -F 'test result: ok. 1 passed; 0 failed;' evidence/legacy-answer-test.log
      - name: Build private-parent check driver and retained converter
        id: driver
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --release -p uor-r4-training --example attention-geometric-event-age-check --example attention-geometric-event-age-q4 2>&1 | tee evidence/driver-build.log
          cp "$CARGO_TARGET_DIR"/release/examples/attention-geometric-event-age-check evidence/
          shasum -a 256 evidence/attention-geometric-event-age-check > evidence/binary-sha256.txt
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/codex-geometric-event-age-q4
          key: event-age-${{ runner.os }}-connected-training-and-driver-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - name: Record actual outcomes
        if: always()
        run: |
          mkdir -p evidence
          printf '%s\n' 'tests=${{ steps.tests.outcome }}' 'driver=${{ steps.driver.outcome }}' > evidence/outcome.txt
          cat evidence/outcome.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-held-credit-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
