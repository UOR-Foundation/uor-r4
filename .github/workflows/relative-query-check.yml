name: Relative query verification

on:
  pull_request:
    paths:
      - '.github/workflows/relative-query-check.yml'
      - 'crates/uor-r4-core/src/native_geometric/learner/hamilton_transport.rs'
      - 'crates/uor-r4-core/src/native_geometric/learner/relative_action_learning.rs'
      - 'tests/relative_query_standalone.rs'
  push:
    branches: ['codex/compiled-relative-query-20260924']

permissions:
  contents: read

jobs:
  relative-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Rust toolchain and compile actual source modules
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test -C opt-level=2 tests/relative_query_standalone.rs -o "$RUNNER_TEMP/relative-query-tests"
          "$RUNNER_TEMP/relative-query-tests" --test-threads=1 --nocapture
      - name: Check formatting of touched Rust files
        shell: bash
        run: |
          rustfmt --edition 2021 --check crates/uor-r4-core/src/native_geometric/learner/relative_action_learning.rs tests/relative_query_standalone.rs
