[package]
name = "m2-fresh-heldout-panel-instrument"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: detached from the repository workspace on purpose, so this
# instrument can never change what the workspace builds.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
