[workspace]

[package]
name = "question-causal-state-cuda"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "question-causal-state-cuda"
path = "main.rs"

[dependencies]
uor-r4-integer = { path = "../../../crates/uor-r4-integer", features = ["reader-serving"] }
uor-r4-discrete = { path = "../../../crates/uor-r4-discrete", features = ["cuda", "qualification"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
hex = "0.4.3"

[patch.crates-io]
cudarc = { path = "../../../third_party/cudarc-0.19.10" }
