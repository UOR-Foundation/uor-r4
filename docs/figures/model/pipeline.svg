<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" role="img" aria-labelledby="t d">
<title id="t">The model pipeline, stage by stage</title>
<desc id="d">Two model paths share the integer D11 serving boundary. The discrete path produced the M1 19-table UORLUT01 pair: DEV 7,002 / 7,001, Fresh V2 7,215 / 7,228 and p-f 7,850 / 7,872 at two seeds, with exact 14,287-row DEV export agreement and Apple M1 decode at 10,876 / 10,566 tok/s. The separate float-trained FBS trunk uses a learned table, SpiralCore position, a Hamilton-gated recurrence, Hamming reads and exact turn memory, with exact rotations and its export gap inside the bar under lut-stack/5 at DEV scope and 4,217 to 4,504 tok/s. M1 is not useful-chat qualification; current work is new-phrasing reply opening and a reachable memory key, then joined serving and R7.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
.title { font-size: 19px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--muted); }
.name { font-size: 13px; font-weight: 600; }
.detail { font-size: 11px; fill: var(--muted); }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
.tag-built { fill: var(--blue); }
.tag-trained { fill: var(--green); }
.tag-missing { fill: var(--verm); }
.note { font-size: 11px; fill: var(--muted); }
.badge-t { font-size: 11px; font-weight: 700; fill: var(--bg); }
.q { font-size: 12px; font-weight: 700; fill: var(--verm); }
.in { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
.built { fill: var(--blue); fill-opacity: 0.12; stroke: var(--blue); stroke-width: 1.75; }
.trained { fill: var(--green); fill-opacity: 0.12; stroke: var(--green); stroke-width: 1.75; }
.ring { fill: none; stroke: var(--green); stroke-width: 1.25; }
.missing { fill: none; stroke: var(--verm); stroke-width: 1.75; stroke-dasharray: 5 4; }
.badge-b { fill: var(--blue); }
.badge-g { fill: var(--green); }
.badge-v { fill: var(--verm); }
.flow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
.flow-learn { stroke: var(--green); stroke-width: 1.75; fill: none; }
.flow-miss { stroke: var(--verm); stroke-width: 1.75; fill: none; stroke-dasharray: 5 4; }
.stub { stroke: var(--verm); stroke-width: 1.25; fill: none; stroke-dasharray: 3 3; }
.dot { fill: var(--verm); }
.rule { stroke: var(--rule); stroke-width: 1; }
.ah { fill: var(--muted); }
.ah-g { fill: var(--green); }
.ah-v { fill: var(--verm); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-g" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-v" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
